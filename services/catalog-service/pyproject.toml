[project]
name = "catalog-service"
version = "0.1.0"
description = "Módulo 2: Catálogo, GIS & Inteligencia de Destino de la Plataforma Digital de Turismo — Santa Marta"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "prometheus-fastapi-instrumentator>=7.0",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Solo app/ tiene __init__.py; importlib evita choques entre pruebas con el mismo nombre.
addopts = "--import-mode=importlib"
